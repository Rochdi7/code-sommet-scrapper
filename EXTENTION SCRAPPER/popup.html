<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CodeSommet Maps Scraper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-brand">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect width="24" height="24" rx="6" fill="var(--accent)"/>
          <path d="M7 12L10.5 15.5L17 8.5" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>CodeSommet</h1>
        <span class="header-subtitle">Maps Scraper</span>
      </div>
    </div>
    <span id="status-badge" class="status-badge status-idle">Idle</span>
  </header>

  <!-- Scrape Controls -->
  <section class="section controls-section">
    <div class="controls-row">
      <button id="btn-scrape" class="btn btn-primary">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M2 3h12M2 8h12M2 13h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        Scrape Current Page
      </button>
      <div class="depth-control">
        <label for="depth">Depth</label>
        <select id="depth">
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3" selected>3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
          <option value="9">9</option>
          <option value="10">10</option>
        </select>
      </div>
    </div>
    <div class="options-row">
      <label class="checkbox-label">
        <input type="checkbox" id="opt-emails">
        <span class="checkmark"></span>
        Extract Emails from websites
      </label>
      <label class="checkbox-label">
        <input type="checkbox" id="opt-reviews">
        <span class="checkmark"></span>
        Extract Reviews
      </label>
    </div>
  </section>

  <!-- Progress -->
  <section class="section progress-section" id="progress-section">
    <div class="progress-bar-track">
      <div class="progress-bar-fill" id="progress-bar" style="width: 0%"></div>
    </div>
    <p class="progress-text" id="progress-text">Scraped 0 / 0 businesses</p>
  </section>

  <!-- Results -->
  <section class="section results-section">
    <div class="results-header">
      <h2>Results <span class="results-count" id="results-count">0</span></h2>
    </div>
    <div class="filter-bar">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn filter-hot" data-filter="no-website">No Website
        <span class="filter-tag">HOT</span>
      </button>
      <button class="filter-btn" data-filter="low-rating">&lt;4.0</button>
      <button class="filter-btn" data-filter="has-email">Has Email</button>
      <button class="filter-btn" data-filter="has-phone">Has Phone</button>
    </div>
    <div class="results-list" id="results-list">
      <!-- Result cards are injected here by popup.js -->
      <div class="empty-state" id="empty-state">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
          <circle cx="20" cy="20" r="18" stroke="var(--text-muted)" stroke-width="1.5" stroke-dasharray="4 3"/>
          <path d="M14 20h12M20 14v12" stroke="var(--text-muted)" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <p>No results yet. Open a Google Maps search and click <strong>Scrape Current Page</strong>.</p>
      </div>
    </div>
  </section>

  <!-- Export -->
  <section class="section export-section">
    <button id="btn-csv" class="btn btn-export">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M7 1v8M3.5 6L7 9.5 10.5 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M1.5 11.5h11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      Export CSV
    </button>
    <button id="btn-json" class="btn btn-export">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M7 1v8M3.5 6L7 9.5 10.5 6" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M1.5 11.5h11" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      Export JSON
    </button>
    <button id="btn-clear" class="btn btn-danger">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M2.5 4h9M5.5 4V2.5h3V4M3.5 4v7.5h7V4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Clear
    </button>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <a href="https://codesommet.com" target="_blank" rel="noopener noreferrer">codesommet.com</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
