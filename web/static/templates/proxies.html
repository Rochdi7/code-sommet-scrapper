        <div class="main-area">
            <header class="topbar">
                <div class="topbar-left">
                    <h2 class="topbar-title">Proxy Monitor</h2>
                    <span class="topbar-breadcrumb">Test and manage your proxy servers</span>
                </div>
                <div class="topbar-right"></div>
            </header>
            <div class="content-area">
                <!-- Input Section -->
                <div class="card">
                    <div class="card-body">
                        <h2>Check Proxies</h2>
                        <form id="proxy-form" onsubmit="return submitProxyCheck(event)">
                            <div class="form-group">
                                <label for="proxy-textarea">Proxy List (one per line, e.g. http://user:pass@host:port):</label>
                                <textarea id="proxy-textarea" name="proxies" rows="6" placeholder="http://proxy1:8080&#10;socks5://user:pass@proxy2:1080&#10;http://proxy3:3128"></textarea>
                            </div>
                            <div class="proxy-actions-row" style="display:flex; gap:0.5rem; align-items:center;">
                                <button type="submit" id="check-all-btn" class="btn btn-primary">Check All</button>
                                <label class="btn btn-secondary btn-sm">
                                    Import from file
                                    <input type="file" accept=".txt,.csv" onchange="importProxyFile(this)" style="display:none;">
                                </label>
                                <label class="proxy-auto-refresh">
                                    <input type="checkbox" id="auto-refresh-toggle" onchange="toggleAutoRefresh(this)">
                                    Check every 60s
                                </label>
                                <span id="proxy-spinner" style="display:none; color: var(--color-primary); font-weight: 500;">Checking proxies...</span>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Results (rendered via JS) -->
                <div id="proxy-results"></div>
            </div>
        </div>
    </div>

    <script>
    function submitProxyCheck(e) {
        e.preventDefault();
        var textarea = document.getElementById('proxy-textarea');
        var proxies = textarea.value.trim();
        if (!proxies) {
            alert('Please enter at least one proxy.');
            return false;
        }

        var spinner = document.getElementById('proxy-spinner');
        var btn = document.getElementById('check-all-btn');
        spinner.style.display = 'inline';
        btn.disabled = true;
        btn.textContent = 'Checking...';

        var formData = new FormData();
        formData.append('proxies', proxies);

        fetch('/proxies/check', {
            method: 'POST',
            body: formData
        })
        .then(function(r) {
            if (!r.ok) return r.text().then(function(t) { throw new Error(t); });
            return r.text();
        })
        .then(function() {
            loadProxyStatuses();
        })
        .catch(function(err) {
            alert('Error: ' + err.message);
        })
        .finally(function() {
            spinner.style.display = 'none';
            btn.disabled = false;
            btn.textContent = 'Check All';
        });

        return false;
    }

    function loadProxyStatuses() {
        fetch('/api/v1/proxies/status')
            .then(function(r) { return r.json(); })
            .then(function(statuses) {
                renderProxyResults(statuses);
            });
    }

    function renderProxyResults(statuses) {
        var container = document.getElementById('proxy-results');
        if (!statuses || statuses.length === 0) {
            container.innerHTML = '';
            return;
        }

        var alive = 0, dead = 0, totalMs = 0, aliveForAvg = 0;
        statuses.forEach(function(s) {
            var ms = s.response_time_ms / 1000000;
            if (s.alive) {
                alive++;
                totalMs += ms;
                aliveForAvg++;
            } else {
                dead++;
            }
        });

        var avgText = 'N/A';
        if (aliveForAvg > 0) {
            var avg = totalMs / aliveForAvg;
            avgText = avg < 1000 ? Math.round(avg) + 'ms' : (avg / 1000).toFixed(1) + 's';
        }

        var html = '';

        // Summary
        html += '<div class="proxy-summary">';
        html += '<div class="stat-cards stat-cards-small">';
        html += '<div class="stat-card stat-card-primary stat-card-mini"><div class="stat-card-value">' + statuses.length + '</div><div class="stat-card-label">Total Proxies</div></div>';
        html += '<div class="stat-card stat-card-success stat-card-mini"><div class="stat-card-value">' + alive + '</div><div class="stat-card-label">Alive</div></div>';
        html += '<div class="stat-card stat-card-error stat-card-mini"><div class="stat-card-value">' + dead + '</div><div class="stat-card-label">Dead</div></div>';
        html += '<div class="stat-card stat-card-warning stat-card-mini"><div class="stat-card-value">' + avgText + '</div><div class="stat-card-label">Avg Response</div></div>';
        html += '</div></div>';

        // Table
        html += '<div class="proxy-card">';
        html += '<div class="proxy-table-header"><h2>Results</h2>';
        html += '<div class="proxy-table-actions">';
        html += '<button type="button" class="btn btn-sm btn-secondary" onclick="copyHealthyProxies()">Copy Healthy Proxies</button>';
        html += '<button type="button" class="btn btn-sm btn-success" onclick="useInNextJob()">Use in Next Job</button>';
        html += '</div></div>';
        html += '<div class="results-table-wrap"><table id="proxy-table"><thead><tr>';
        html += '<th>URL</th><th>Status</th><th>Response Time</th><th>Success Rate</th><th>Last Checked</th><th>Actions</th>';
        html += '</tr></thead><tbody>';

        statuses.forEach(function(s) {
            var rtMs = s.response_time_ms / 1000000;
            var rtText = rtMs < 1000 ? Math.round(rtMs) + 'ms' : (rtMs / 1000).toFixed(1) + 's';
            var rtClass = rtMs < 2000 ? 'rt-fast' : (rtMs < 5000 ? 'rt-medium' : 'rt-slow');
            var rowClass = !s.alive ? 'proxy-dead' : (rtMs > 5000 ? 'proxy-slow' : 'proxy-alive');
            var badgeClass = s.alive ? 'proxy-badge-alive' : 'proxy-badge-dead';
            var badgeText = s.alive ? 'Alive' : 'Dead';
            var rate = Math.round(s.success_rate);
            var lastChecked = s.last_checked ? new Date(s.last_checked).toLocaleString() : '-';

            html += '<tr class="proxy-row ' + rowClass + '">';
            html += '<td class="proxy-url-cell">' + escapeHtml(s.url) + '</td>';
            html += '<td><span class="proxy-status-badge ' + badgeClass + '">' + badgeText + '</span></td>';
            html += '<td><span class="' + rtClass + '">' + rtText + '</span></td>';
            html += '<td><div class="proxy-bar-wrap"><div class="proxy-bar" style="width:' + rate + '%"></div></div><span class="proxy-rate-text">' + rate + '%</span></td>';
            html += '<td>' + lastChecked + '</td>';
            html += '<td class="action-cell"><button type="button" class="view-btn" onclick="recheckProxy(\'' + escapeAttr(s.url) + '\')">Recheck</button></td>';
            html += '</tr>';
        });

        html += '</tbody></table></div></div>';
        container.innerHTML = html;
    }

    function escapeHtml(text) {
        var div = document.createElement('div');
        div.appendChild(document.createTextNode(text));
        return div.innerHTML;
    }

    function escapeAttr(text) {
        return text.replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

    function importProxyFile(input) {
        var file = input.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('proxy-textarea').value = e.target.result;
        };
        reader.readAsText(file);
    }

    var autoRefreshTimer = null;
    function toggleAutoRefresh(cb) {
        if (cb.checked) {
            autoRefreshTimer = setInterval(function() {
                submitProxyCheck(new Event('submit'));
            }, 60000);
        } else {
            clearInterval(autoRefreshTimer);
            autoRefreshTimer = null;
        }
    }

    function copyHealthyProxies() {
        var rows = document.querySelectorAll('#proxy-table tbody tr.proxy-alive, #proxy-table tbody tr.proxy-slow');
        var urls = [];
        rows.forEach(function(row) {
            var urlCell = row.querySelector('.proxy-url-cell');
            if (urlCell) urls.push(urlCell.textContent.trim());
        });
        if (urls.length === 0) {
            alert('No healthy proxies to copy.');
            return;
        }
        navigator.clipboard.writeText(urls.join('\n')).then(function() {
            alert('Copied ' + urls.length + ' healthy proxies to clipboard.');
        });
    }

    function useInNextJob() {
        var rows = document.querySelectorAll('#proxy-table tbody tr.proxy-alive, #proxy-table tbody tr.proxy-slow');
        var urls = [];
        rows.forEach(function(row) {
            var urlCell = row.querySelector('.proxy-url-cell');
            if (urlCell) urls.push(urlCell.textContent.trim());
        });
        if (urls.length === 0) {
            alert('No healthy proxies available.');
            return;
        }
        localStorage.setItem('healthy_proxies', urls.join('\n'));
        alert('Saved ' + urls.length + ' healthy proxies. They will be auto-filled on the scraper page.');
    }

    function recheckProxy(url) {
        var textarea = document.getElementById('proxy-textarea');
        textarea.value = url;
        submitProxyCheck(new Event('submit'));
    }

    // Initial load
    loadProxyStatuses();
    </script>
</body>
